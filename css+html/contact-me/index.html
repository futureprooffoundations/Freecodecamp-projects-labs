<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Contact Form</title>
    <link href="styles.css" rel="stylesheet">
</head>

<body>
<div class="form-container">
    <form>
        <h2>Contact Me</h2>
        <label for="name">Name: <input type="text" id="name" name="name" required /></label>
        <label for="email">Email: <input type="email" id="email" name="email" required /></label>
        <label for="message">Message: <textarea id="message" name=" message" placeholder="Enter your message" required></textarea></label>
        <button type="submit">Submit</button>
        </form>
        </div>
</body>

</html>
